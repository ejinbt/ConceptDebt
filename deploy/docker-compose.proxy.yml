# Join an existing reverse proxy's Docker network (e.g. a shared Caddy/Traefik
# container that already owns ports 80/443), so it can reach the API at
# http://conceptdebt-api:8000.
# Enable it in deploy/.env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#   PROXY_NETWORK=<the proxy container's network name>
services:
  api:
    networks:
      default:
      proxy:
        aliases: [conceptdebt-api]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in deploy/.env}
