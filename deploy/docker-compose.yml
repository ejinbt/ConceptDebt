# Backend + HTTPS on a VPS.
#   cp .env.example .env   # set DOMAIN
#   docker compose up -d --build
services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      # keep the SQLite database on a volume so it survives rebuilds
      DATABASE_URL: sqlite:////data/conceptdebt.db
    volumes:
      - api-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  api-data:
  caddy-data:
  caddy-config:
