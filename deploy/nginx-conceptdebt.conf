# For a server that already runs nginx on 80/443.
#   sudo cp nginx-conceptdebt.conf /etc/nginx/sites-available/conceptdebt
#   sudo ln -s /etc/nginx/sites-available/conceptdebt /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.94.249.197.142.sslip.io     # adds HTTPS
# Your other sites are untouched: nginx picks the site by server_name.
server {
    listen 80;
    server_name api.94.249.197.142.sslip.io;   # or your own domain

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;      # API_PORT from deploy/.env
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;                # AI calls can take a few seconds
    }
}
