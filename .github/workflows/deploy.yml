# Test, then deploy the backend to the VPS over SSH.
# Setup (secrets, server key): deploy/README.md -> "Auto-deploy with GitHub Actions"
name: Test & deploy backend

on:
  push:
    branches: [backend]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and rebuild on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch origin backend
            git reset --hard origin/backend
            cd deploy
            docker compose up -d --build --remove-orphans
            echo "waiting for the API..."
            for i in $(seq 1 30); do
              if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"; then
                echo "API healthy"
                docker image prune -f >/dev/null
                exit 0
              fi
              sleep 2
            done
            echo "API did not become healthy"; docker compose logs --tail 50 api; exit 1
